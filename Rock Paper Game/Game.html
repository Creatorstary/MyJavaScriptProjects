<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Game.css">
</head>

<body>
    <h1>Rock Paper Scissors Game</h1>

    <div class="content">
        <div id="rock" class="rps">Rock</div>
        <div id="paper" class="rps">Paper</div>
        <div id="scissors" class="rps">Scissors</div>
    </div>

    <div id='playerchoice'>Player: </div>
    <div id='computerchoice'>Computer:</div>
    <div id='result'></div>

    <div class="playerscore">Player Score: <span id="playerScore">0</span></div>
    <div class="computerscore">Computer Score: <span id="computerScore">0</span></div>

    <script src="Game.js"></script>
</body>

</html>
